<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>お散歩AIナビゲーター</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🚶‍♂️</text></svg>">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f2744 100%);
      --glass-bg: rgba(255, 255, 255, 0.05);
      --glass-border: rgba(255, 255, 255, 0.12);
      --card-bg: #1e293b;
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      
      --accent-cyan: #06b6d4;
      --accent-green: #10b981;
      --accent-amber: #f59e0b;
      --accent-gradient: linear-gradient(135deg, #06b6d4 0%, #3b82f6 100%);
      
      --user-bubble: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
      --bot-bubble: rgba(255, 255, 255, 0.06);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg-gradient);
      color: var(--text-primary);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 12px;
    }

    .chat-container {
      width: 100%;
      max-width: 900px;
      height: 92vh;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(16px);
      border-radius: 20px;
      border: 1px solid var(--glass-border);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ヘッダー */
    header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--glass-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(255, 255, 255, 0.02);
    }

    .header-title {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .header-icon {
      width: 36px;
      height: 36px;
      background: var(--accent-gradient);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
    }

    /* 設定エリア */
    .walk-settings {
      padding: 14px 20px;
      background: rgba(0, 0, 0, 0.2);
      border-bottom: 1px solid var(--glass-border);
      display: flex;
      flex-direction: column;
      gap: 10px;
      font-size: 0.85rem;
    }

    .setting-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
    }

    .mode-selector {
      display: flex;
      gap: 6px;
      background: rgba(255, 255, 255, 0.05);
      padding: 3px;
      border-radius: 8px;
    }

    .mode-btn {
      padding: 6px 12px;
      border-radius: 6px;
      border: none;
      background: transparent;
      color: var(--text-secondary);
      cursor: pointer;
      font-size: 0.82rem;
      font-weight: 600;
    }

    .mode-btn.active {
      background: var(--accent-cyan);
      color: #fff;
    }

    select, input[type="text"] {
      padding: 6px 10px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--glass-border);
      border-radius: 6px;
      color: #fff;
      font-size: 0.82rem;
      outline: none;
    }

    select option {
      background: #1e293b;
      color: #fff;
    }

    .geo-btn {
      padding: 6px 10px;
      background: rgba(16, 185, 129, 0.2);
      border: 1px solid var(--accent-green);
      color: var(--accent-green);
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.8rem;
    }

    /* ステータスバー（散歩中の状態変化） */
    .status-bar {
      padding: 8px 20px;
      background: rgba(245, 158, 11, 0.1);
      border-bottom: 1px solid rgba(245, 158, 11, 0.3);
      display: flex;
      align-items: center;
      gap: 8px;
      overflow-x: auto;
    }

    .status-label {
      font-size: 0.78rem;
      color: var(--accent-amber);
      white-space: nowrap;
      font-weight: bold;
    }

    .status-chip {
      padding: 4px 10px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--glass-border);
      border-radius: 12px;
      font-size: 0.75rem;
      color: var(--text-primary);
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s;
    }

    .status-chip:hover, .status-chip.active {
      background: var(--accent-amber);
      color: #000;
      font-weight: bold;
    }

    /* チャット枠 */
    #chat-box {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .message {
      max-width: 85%;
      padding: 12px 16px;
      border-radius: 16px;
      line-height: 1.6;
      font-size: 0.92rem;
      word-break: break-word;
      animation: fadeIn 0.2s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .message.user {
      align-self: flex-end;
      background: var(--user-bubble);
      color: #fff;
      border-bottom-right-radius: 2px;
    }

    .message.bot {
      align-self: flex-start;
      background: var(--bot-bubble);
      border: 1px solid var(--glass-border);
      color: var(--text-primary);
      border-bottom-left-radius: 2px;
    }

    .message.bot p { margin-bottom: 0.5em; }
    .message.bot p:last-child { margin-bottom: 0; }
    .message.bot ul, .message.bot ol { margin-left: 1.2em; margin-bottom: 0.5em; }

    /* 入力エリア */
    .input-container {
      padding: 14px 20px;
      background: rgba(15, 23, 42, 0.95);
      border-top: 1px solid var(--glass-border);
    }

    .input-area {
      display: flex;
      gap: 10px;
    }

    .input-area input {
      flex: 1;
      padding: 12px 16px;
      border-radius: 10px;
    }

    .send-btn {
      padding: 0 20px;
      background: var(--accent-gradient);
      color: white;
      border: none;
      border-radius: 10px;
      font-weight: 600;
      cursor: pointer;
    }

    .send-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    /* タイピング表示 */
    .typing-indicator { display: flex; gap: 4px; padding: 4px; }
    .dot { width: 6px; height: 6px; background: var(--accent-cyan); border-radius: 50%; animation: blink 1.2s infinite ease-in-out both; }
    .dot:nth-child(1) { animation-delay: -0.32s; }
    .dot:nth-child(2) { animation-delay: -0.16s; }
    @keyframes blink { 0%, 80%, 100% { opacity: 0.3; } 40% { opacity: 1; } }
  </style>
</head>
<body>

  <div class="chat-container">
    <header>
      <div class="header-title">
        <div class="header-icon">🚶‍♂️</div>
        <h2>お散歩AIナビ</h2>
      </div>
      <div class="mode-selector">
        <button class="mode-btn active" id="btn-child" onclick="switchMode('child')">👶 子ども</button>
        <button class="mode-btn" id="btn-dog" onclick="switchMode('dog')">🐕 愛犬</button>
      </div>
    </header>

    <!-- お散歩事前設定フォーム -->
    <div class="walk-settings">
      <div class="setting-row">
        <button class="geo-btn" onclick="getCurrentLocation()">📍 現在地を取得</button>
        <input type="text" id="loc-input" placeholder="現在地（例: 渋谷区代々木公園周辺）" style="width: 220px;" />
        
        <label>親の疲労度:</label>
        <select id="parent-fatigue">
          <option value="元気">元気</option>
          <option value="少し疲れている">少し疲れている</option>
          <option value="かなり疲れた（ショートコース希望）">かなり疲れた</option>
        </select>
      </div>

      <!-- 子ども用オプション -->
      <div class="setting-row" id="child-options">
        <label>年齢:</label>
        <select id="child-age">
          <option value="0歳(ベビーカー)">0歳(ベビーカー)</option>
          <option value="1〜2歳(よちよち歩き)">1〜2歳(よちよち)</option>
          <option value="3〜4歳(元気に走る)">3〜4歳(元気)</option>
          <option value="5歳以上">5歳以上</option>
        </select>

        <label>体型/体力:</label>
        <select id="child-build">
          <option value="標準">標準</option>
          <option value="体力旺盛">体力旺盛</option>
          <option value="疲れやすい">疲れやすい</option>
        </select>

        <label>目的:</label>
        <select id="walk-purpose">
          <option value="近場の公園で体を動かす">公園で体を動かす</option>
          <option value="景色や街並みを見て帰るだけ">景色を見て散歩</option>
          <option value="カフェや店舗で立ち寄り休憩">カフェ・お店に立ち寄り</option>
        </select>
      </div>

      <!-- 犬用オプション -->
      <div class="setting-row" id="dog-options" style="display: none;">
        <label>犬種サイズ:</label>
        <select id="dog-size">
          <option value="小型犬">小型犬</option>
          <option value="中型犬">中型犬</option>
          <option value="大型犬">大型犬</option>
        </select>

        <label>運動量:</label>
        <select id="dog-energy">
          <option value="ゆったりショート">ゆったりショート</option>
          <option value="標準">標準</option>
          <option value="たっぷりロング">たっぷりロング</option>
        </select>
      </div>
    </div>

    <!-- リアルタイム状態チェンジャー（緊急帰宅・ルート変更用） -->
    <div class="status-bar">
      <span class="status-label">🚨 状態の変化:</span>
      <div class="status-chip" onclick="triggerStatusUpdate('子どもが元気に走り回り出しました！')">⚡ 元気いっぱい</div>
      <div class="status-chip" onclick="triggerStatusUpdate('子どもが少し疲れて歩くのが遅くなってきました。')">😮‍💨 疲れてきた</div>
      <div class="status-chip" onclick="triggerStatusUpdate('子どもがぐずり出しました！ぐずり対策やベンチ、抱っこしやすいルートを教えて！')">😭 ぐずりだした</div>
      <div class="status-chip" onclick="triggerStatusUpdate('子どもが眠そうにして目をこすっています。静かな帰宅ルートを提案して。')">🥱 眠そう</div>
      <div class="status-chip" onclick="triggerStatusUpdate('子どもが寝てしまいました！ベビーカーで段差が少なく、静かに帰れる最短ルートを教えて。')">😴 寝た（最短帰宅）</div>
    </div>

    <!-- チャットログ -->
    <div id="chat-box"></div>

    <!-- 入力エリア -->
    <div class="input-container">
      <div class="input-area">
        <input type="text" id="user-input" placeholder="例: 30分程度でまわれるおすすめルートを教えて！" />
        <button class="send-btn" id="send-btn" onclick="sendMessage()">提案を作成</button>
      </div>
    </div>
  </div>

  <script>
    let currentMode = 'child';
    let currentStatus = '通常';
    const conversationHistory = [];

    const chatBox = document.getElementById('chat-box');
    const input = document.getElementById('user-input');
    const sendBtn = document.getElementById('send-btn');

    // モード切り替え
    function switchMode(mode) {
      currentMode = mode;
      document.getElementById('btn-child').classList.toggle('active', mode === 'child');
      document.getElementById('btn-dog').classList.toggle('active', mode === 'dog');
      
      document.getElementById('child-options').style.display = mode === 'child' ? 'flex' : 'none';
      document.getElementById('dog-options').style.display = mode === 'dog' ? 'flex' : 'none';
    }

    // 位置情報の取得（Geolocation API）
    function getCurrentLocation() {
      const locInput = document.getElementById('loc-input');
      if (!navigator.geolocation) {
        alert('お使いのブラウザは位置情報に対応していません。手動で入力してください。');
        return;
      }

      locInput.value = "位置情報を取得中...";
      navigator.geolocation.getCurrentPosition(
        (pos) => {
          const lat = pos.coords.latitude.toFixed(4);
          const lng = pos.coords.longitude.toFixed(4);
          locInput.value = `緯度:${lat}, 経度:${lng} 周辺`;
        },
        (err) => {
          locInput.value = "";
          alert('位置情報の取得に失敗しました。住所や目印を入力してください。');
        }
      );
    }

    function appendMessage(sender, text, isMarkdown = false) {
      const div = document.createElement('div');
      div.className = `message ${sender}`;
      if (isMarkdown && typeof marked !== 'undefined') {
        div.innerHTML = marked.parse(text);
      } else {
        div.textContent = text;
      }
      chatBox.appendChild(div);
      chatBox.scrollTop = chatBox.scrollHeight;
      return div;
    }

    function showTyping() {
      const div = document.createElement('div');
      div.className = 'message bot';
      div.id = 'typing-indicator';
      div.innerHTML = '<div class="typing-indicator"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>';
      chatBox.appendChild(div);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    function removeTyping() {
      const el = document.getElementById('typing-indicator');
      if (el) el.remove();
    }

    // 設定値の集約
    function getWalkContext() {
      const location = document.getElementById('loc-input').value.trim() || '指定なし（一般的な住宅街想定）';
      const parentFatigue = document.getElementById('parent-fatigue').value;

      if (currentMode === 'child') {
        return {
          mode: 'child',
          location,
          parentFatigue,
          childAge: document.getElementById('child-age').value,
          childBuild: document.getElementById('child-build').value,
          purpose: document.getElementById('walk-purpose').value,
          currentStatus
        };
      } else {
        return {
          mode: 'dog',
          location,
          parentFatigue,
          dogSize: document.getElementById('dog-size').value,
          dogEnergy: document.getElementById('dog-energy').value,
          currentStatus
        };
      }
    }

    // 状態変更チップをクリックしたときの即時送信
    function triggerStatusUpdate(statusText) {
      currentStatus = statusText;
      input.value = statusText;
      sendMessage();
    }

    async function sendMessage() {
      const text = input.value.trim();
      if (!text) return;

      appendMessage('user', text);
      conversationHistory.push({ role: 'user', parts: [{ text: text }] });

      input.value = '';
      sendBtn.disabled = true;
      showTyping();

      const walkContext = getWalkContext();

      try {
        const res = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ 
            contents: conversationHistory,
            walkContext: walkContext
          })
        });

        const data = await res.json();
        removeTyping();

        if (data.reply) {
          appendMessage('bot', data.reply, true);
          conversationHistory.push({ role: 'model', parts: [{ text: data.reply }] });
        } else {
          appendMessage('bot', `エラー: ${data.error || '応答の取得に失敗しました'}`);
          conversationHistory.pop();
        }
      } catch (err) {
        removeTyping();
        appendMessage('bot', '通信エラーが発生しました。');
        conversationHistory.pop();
      } finally {
        sendBtn.disabled = false;
      }
    }

    input.addEventListener('keypress', (e) => { if (e.key === 'Enter') sendMessage(); });

    // 初期メッセージ
    appendMessage('bot', 'こんにちは！お散歩AIナビゲーターです。現在の位置情報を指定し、お子様や愛犬の状態に合わせてお散歩ルートをご相談ください！');
  </script>
</body>
</html>
