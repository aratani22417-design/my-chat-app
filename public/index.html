<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI チャットアシスタント</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🤖</text></svg>">
  <!-- Markdownレンダリング用ライブラリ -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    :root {
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-sub: #64748b;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --user-msg: #dbeafe;
      --bot-msg: #f1f5f9;
      --border: #e2e8f0;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
    }

    .chat-container {
      width: 100%;
      max-width: 768px;
      height: 85vh;
      background: var(--card-bg);
      border-radius: 16px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
      border: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 12px;
      background: #ffffff;
    }

    header h1 {
      font-size: 1.125rem;
      font-weight: 600;
    }

    #chat-box {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .message {
      max-width: 80%;
      padding: 12px 16px;
      border-radius: 12px;
      line-height: 1.6;
      font-size: 0.95rem;
      word-break: break-word;
    }

    .message.user {
      align-self: flex-end;
      background-color: var(--primary);
      color: #ffffff;
      border-bottom-right-radius: 2px;
    }

    .message.bot {
      align-self: flex-start;
      background-color: var(--bot-msg);
      color: var(--text-main);
      border-bottom-left-radius: 2px;
    }

    /* Markdownスタイルの微調整 */
    .message.bot p { margin-bottom: 0.5em; }
    .message.bot p:last-child { margin-bottom: 0; }
    .message.bot pre {
      background: #1e293b;
      color: #f8fafc;
      padding: 10px;
      border-radius: 6px;
      overflow-x: auto;
      margin: 8px 0;
    }
    .message.bot code {
      font-family: monospace;
      background: rgba(0,0,0,0.05);
      padding: 2px 4px;
      border-radius: 4px;
    }

    .input-container {
      padding: 16px;
      border-top: 1px solid var(--border);
      background: #ffffff;
    }

    .input-area {
      display: flex;
      gap: 8px;
    }

    input {
      flex: 1;
      padding: 12px 16px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus {
      border-color: var(--primary);
    }

    button {
      padding: 12px 20px;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s;
    }

    button:hover { background: var(--primary-hover); }
    button:disabled { background: var(--text-sub); cursor: not-allowed; }

    /* タイピングインジケーター */
    .typing-indicator {
      display: inline-flex;
      gap: 4px;
      align-items: center;
    }
    .dot {
      width: 6px;
      height: 6px;
      background: var(--text-sub);
      border-radius: 50%;
      animation: blink 1.4s infinite ease-in-out both;
    }
    .dot:nth-child(1) { animation-delay: -0.32s; }
    .dot:nth-child(2) { animation-delay: -0.16s; }

    @keyframes blink {
      0%, 80%, 100% { opacity: 0.3; transform: scale(0.8); }
      40% { opacity: 1; transform: scale(1); }
    }
  </style>
</head>
<body>

  <div class="chat-container">
    <header>
      <span style="font-size: 1.5rem;">🤖</span>
      <h1>AI チャットアシスタント</h1>
    </header>

    <div id="chat-box"></div>

    <div class="input-container">
      <div class="input-area">
        <input type="text" id="user-input" placeholder="メッセージを入力..." autocomplete="off" />
        <button id="send-btn">送信</button>
      </div>
    </div>
  </div>

  <script>
    (() => {
      const chatBox = document.getElementById('chat-box');
      const input = document.getElementById('user-input');
      const sendBtn = document.getElementById('send-btn');

      const conversationHistory = [];

      function appendMessage(sender, text, isMarkdown = false) {
        const div = document.createElement('div');
        div.className = `message ${sender}`;

        if (isMarkdown && typeof marked !== 'undefined') {
          div.innerHTML = marked.parse(text);
        } else {
          div.textContent = text;
        }

        chatBox.appendChild(div);
        chatBox.scrollTop = chatBox.scrollHeight;
        return div;
      }

      function showTypingIndicator() {
        const div = document.createElement('div');
        div.className = 'message bot';
        div.id = 'typing-indicator';
        div.innerHTML = '<div class="typing-indicator"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>';
        chatBox.appendChild(div);
        chatBox.scrollTop = chatBox.scrollHeight;
      }

      function removeTypingIndicator() {
        const el = document.getElementById('typing-indicator');
        if (el) el.remove();
      }

      async function sendMessage() {
        const text = input.value.trim();
        if (!text) return;

        appendMessage('user', text);
        conversationHistory.push({ role: 'user', parts: [{ text: text }] });

        input.value = '';
        sendBtn.disabled = true;
        showTypingIndicator();

        try {
          const res = await fetch('/api/chat', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ contents: conversationHistory })
          });

          const data = await res.json();
          removeTypingIndicator();

          if (data.reply) {
            appendMessage('bot', data.reply, true);
            conversationHistory.push({ role: 'model', parts: [{ text: data.reply }] });
          } else {
            appendMessage('bot', `エラー: ${data.error || '応答の取得に失敗しました'}`);
            conversationHistory.pop();
          }
        } catch (err) {
          removeTypingIndicator();
          appendMessage('bot', '通信エラーが発生しました。');
          conversationHistory.pop();
        } finally {
          sendBtn.disabled = false;
          input.focus();
        }
      }

      sendBtn.addEventListener('click', sendMessage);
      input.addEventListener('keypress', (e) => { if (e.key === 'Enter') sendMessage(); });
    })();
  </script>
</body>
</html>
