<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Assistant</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚡</text></svg>">
  <!-- Markdownレンダリング用 -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f2744 100%);
      --glass-bg: rgba(255, 255, 255, 0.05);
      --glass-border: rgba(255, 255, 255, 0.12);
      --card-bg: #1e293b;
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      
      --accent-cyan: #06b6d4;
      --accent-blue: #3b82f6;
      --accent-gradient: linear-gradient(135deg, #06b6d4 0%, #3b82f6 100%);
      
      --user-bubble: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
      --bot-bubble: rgba(255, 255, 255, 0.06);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: var(--bg-gradient);
      color: var(--text-primary);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
    }

    /* メインコンテナ（グラスモーフィズム調） */
    .chat-container {
      width: 100%;
      max-width: 800px;
      height: 88vh;
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-radius: 24px;
      border: 1px solid var(--glass-border);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ヘッダー */
    header {
      padding: 20px 24px;
      border-bottom: 1px solid var(--glass-border);
      display: flex;
      align-items: center;
      gap: 12px;
      background: rgba(255, 255, 255, 0.02);
    }

    .header-icon {
      width: 38px;
      height: 38px;
      background: var(--accent-gradient);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      box-shadow: 0 0 15px rgba(6, 182, 212, 0.4);
    }

    header h1 {
      font-size: 1.15rem;
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    header .status-dot {
      width: 8px;
      height: 8px;
      background: #10b981;
      border-radius: 50%;
      box-shadow: 0 0 8px #10b981;
      margin-left: auto;
    }

    /* チャット表示エリア */
    #chat-box {
      flex: 1;
      padding: 24px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 18px;
      scroll-behavior: smooth;
    }

    /* カスタムスクロールバー */
    #chat-box::-webkit-scrollbar {
      width: 6px;
    }
    #chat-box::-webkit-scrollbar-thumb {
      background: var(--glass-border);
      border-radius: 3px;
    }

    /* メッセージの共通スタイル */
    .message {
      max-width: 82%;
      padding: 14px 18px;
      border-radius: 18px;
      line-height: 1.6;
      font-size: 0.95rem;
      word-break: break-word;
      animation: fadeIn 0.25s ease-out forwards;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .message.user {
      align-self: flex-end;
      background: var(--user-bubble);
      color: #ffffff;
      border-bottom-right-radius: 4px;
      box-shadow: 0 4px 15px rgba(37, 99, 235, 0.3);
    }

    .message.bot {
      align-self: flex-start;
      background: var(--bot-bubble);
      border: 1px solid var(--glass-border);
      color: var(--text-primary);
      border-bottom-left-radius: 4px;
    }

    /* Markdown要素の装飾 */
    .message.bot p { margin-bottom: 0.6em; }
    .message.bot p:last-child { margin-bottom: 0; }
    .message.bot pre {
      background: #090d16;
      border: 1px solid var(--glass-border);
      color: #38bdf8;
      padding: 12px;
      border-radius: 8px;
      overflow-x: auto;
      margin: 10px 0;
      font-family: 'Fira Code', Consolas, monospace;
      font-size: 0.88rem;
    }
    .message.bot code {
      font-family: 'Fira Code', Consolas, monospace;
      background: rgba(255, 255, 255, 0.1);
      padding: 2px 6px;
      border-radius: 4px;
      color: #38bdf8;
    }

    /* 入力フォームエリア */
    .input-container {
      padding: 16px 24px 20px;
      background: rgba(15, 23, 42, 0.9);
      border-top: 1px solid var(--glass-border);
    }

    .input-area {
      display: flex;
      gap: 12px;
      position: relative;
    }

    input {
      flex: 1;
      padding: 14px 20px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--glass-border);
      border-radius: 14px;
      color: #ffffff;
      font-size: 0.95rem;
      outline: none;
      transition: all 0.2s ease;
    }

    input::placeholder {
      color: var(--text-secondary);
    }

    input:focus {
      border-color: var(--accent-cyan);
      box-shadow: 0 0 12px rgba(6, 182, 212, 0.3);
      background: rgba(255, 255, 255, 0.08);
    }

    button {
      padding: 0 24px;
      background: var(--accent-gradient);
      color: white;
      border: none;
      border-radius: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 4px 15px rgba(6, 182, 212, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    button:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(6, 182, 212, 0.5);
    }

    button:active {
      transform: translateY(1px);
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      box-shadow: none;
      transform: none;
    }

    /* タイピングインジケーター */
    .typing-indicator {
      display: inline-flex;
      gap: 6px;
      align-items: center;
      padding: 4px 0;
    }
    .dot {
      width: 7px;
      height: 7px;
      background: var(--accent-cyan);
      border-radius: 50%;
      animation: pulse 1.2s infinite ease-in-out both;
    }
    .dot:nth-child(1) { animation-delay: -0.32s; }
    .dot:nth-child(2) { animation-delay: -0.16s; }

    @keyframes pulse {
      0%, 80%, 100% { opacity: 0.2; transform: scale(0.8); }
      40% { opacity: 1; transform: scale(1.1); box-shadow: 0 0 8px var(--accent-cyan); }
    }
  </style>
</head>
<body>

  <div class="chat-container">
    <header>
      <div class="header-icon">⚡</div>
      <h1>AI Assistant</h1>
      <div class="status-dot" title="Online"></div>
    </header>

    <div id="chat-box"></div>

    <div class="input-container">
      <div class="input-area">
        <input type="text" id="user-input" placeholder="メッセージを入力..." autocomplete="off" />
        <button id="send-btn">送信</button>
      </div>
    </div>
  </div>

  <script>
    (() => {
      const chatBox = document.getElementById('chat-box');
      const input = document.getElementById('user-input');
      const sendBtn = document.getElementById('send-btn');

      const conversationHistory = [];

      function appendMessage(sender, text, isMarkdown = false) {
        const div = document.createElement('div');
        div.className = `message ${sender}`;

        if (isMarkdown && typeof marked !== 'undefined') {
          div.innerHTML = marked.parse(text);
        } else {
          div.textContent = text;
        }

        chatBox.appendChild(div);
        chatBox.scrollTop = chatBox.scrollHeight;
        return div;
      }

      function showTypingIndicator() {
        const div = document.createElement('div');
        div.className = 'message bot';
        div.id = 'typing-indicator';
        div.innerHTML = '<div class="typing-indicator"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>';
        chatBox.appendChild(div);
        chatBox.scrollTop = chatBox.scrollHeight;
      }

      function removeTypingIndicator() {
        const el = document.getElementById('typing-indicator');
        if (el) el.remove();
      }

      async function sendMessage() {
        const text = input.value.trim();
        if (!text) return;

        appendMessage('user', text);
        conversationHistory.push({ role: 'user', parts: [{ text: text }] });

        input.value = '';
        sendBtn.disabled = true;
        showTypingIndicator();

        try {
          const res = await fetch('/api/chat', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ contents: conversationHistory })
          });

          const data = await res.json();
          removeTypingIndicator();

          if (data.reply) {
            appendMessage('bot', data.reply, true);
            conversationHistory.push({ role: 'model', parts: [{ text: data.reply }] });
          } else {
            appendMessage('bot', `エラー: ${data.error || '応答の取得に失敗しました'}`);
            conversationHistory.pop();
          }
        } catch (err) {
          removeTypingIndicator();
          appendMessage('bot', '通信エラーが発生しました。');
          conversationHistory.pop();
        } finally {
          sendBtn.disabled = false;
          input.focus();
        }
      }

      sendBtn.addEventListener('click', sendMessage);
      input.addEventListener('keypress', (e) => { if (e.key === 'Enter') sendMessage(); });
    })();
  </script>
</body>
</html>
