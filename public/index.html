<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>お散歩ルートプランナー</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🗺️</text></svg>">
  
  <!-- Map (Leaflet.js) -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- FontAwesome (Icons) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f2744 100%);
      --glass-bg: rgba(15, 23, 42, 0.88);
      --glass-border: rgba(255, 255, 255, 0.12);
      --card-bg: #1e293b;
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      
      --accent-cyan: #06b6d4;
      --accent-blue: #3b82f6;
      --accent-green: #10b981;
      --accent-amber: #f59e0b;
      --accent-gradient: linear-gradient(135deg, #06b6d4 0%, #3b82f6 100%);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg-gradient);
      color: var(--text-primary);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 0;
    }

    /* レスポンシブコンテナ */
    .app-container {
      width: 100%;
      max-width: 1200px;
      height: 100vh;
      background: var(--glass-bg);
      backdrop-filter: blur(16px);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
    }

    @media (min-width: 768px) {
      .app-container {
        height: 94vh;
        border-radius: 20px;
        border: 1px solid var(--glass-border);
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
      }
    }

    header {
      padding: 14px 20px;
      border-bottom: 1px solid var(--glass-border);
      background: rgba(255, 255, 255, 0.02);
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }

    .header-icon {
      width: 34px;
      height: 34px;
      background: var(--accent-gradient);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
    }

    header h2 { font-size: 1.1rem; font-weight: 600; }

    /* メインエリア（PCでは2カラム、スマホでは1カラム） */
    .main-layout {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    @media (min-width: 768px) {
      .main-layout {
        flex-direction: row;
      }
    }

    /* 左パネル（フォーム＆タイムライン） */
    .left-panel {
      width: 100%;
      display: flex;
      flex-direction: column;
      border-bottom: 1px solid var(--glass-border);
      overflow-y: auto;
    }

    @media (min-width: 768px) {
      .left-panel {
        width: 400px;
        flex-shrink: 0;
        border-bottom: none;
        border-right: 1px solid var(--glass-border);
      }
    }

    /* 右パネル（大画面マップ） */
    .right-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      position: relative;
      height: 350px;
    }

    @media (min-width: 768px) {
      .right-panel {
        height: 100%;
      }
    }

    #map {
      width: 100%;
      height: 100%;
      background: #090d16;
    }

    /* フォーム領域 */
    .walk-control-panel {
      padding: 14px 16px;
      background: rgba(0, 0, 0, 0.25);
      border-bottom: 1px solid var(--glass-border);
      display: flex;
      flex-direction: column;
      gap: 10px;
      font-size: 0.82rem;
    }

    .setting-group {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }

    .form-item {
      display: flex;
      align-items: center;
      gap: 4px;
      flex: 1 1 calc(50% - 4px);
      min-width: 130px;
    }

    .form-item.full {
      flex: 1 1 100%;
    }

    label { color: var(--text-secondary); font-size: 0.75rem; white-space: nowrap; }

    input[type="text"], select {
      width: 100%;
      padding: 6px 10px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--glass-border);
      border-radius: 6px;
      color: #fff;
      font-size: 0.8rem;
      outline: none;
    }

    input[type="text"]:focus, select:focus { border-color: var(--accent-cyan); }
    select option { background: #1e293b; color: #fff; }

    .btn-icon {
      padding: 6px 10px;
      background: rgba(16, 185, 129, 0.2);
      border: 1px solid var(--accent-green);
      color: var(--accent-green);
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.75rem;
      white-space: nowrap;
    }

    .btn-submit {
      width: 100%;
      padding: 10px;
      background: var(--accent-gradient);
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.88rem;
      cursor: pointer;
      margin-top: 4px;
      transition: all 0.2s;
      box-shadow: 0 4px 12px rgba(6, 182, 212, 0.3);
    }
    .btn-submit:hover { opacity: 0.9; }
    .btn-submit:disabled { opacity: 0.5; cursor: not-allowed; }

    /* 状況変化ボタン */
    .status-bar {
      padding: 10px 16px;
      background: rgba(245, 158, 11, 0.12);
      border-bottom: 1px solid rgba(245, 158, 11, 0.3);
      display: flex;
      align-items: center;
      gap: 6px;
      overflow-x: auto;
      flex-shrink: 0;
    }
    .status-label { font-size: 0.75rem; color: var(--accent-amber); white-space: nowrap; font-weight: bold; }
    .status-chip {
      padding: 4px 10px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--glass-border);
      border-radius: 12px;
      font-size: 0.72rem;
      cursor: pointer;
      white-space: nowrap;
    }
    .status-chip:hover { background: var(--accent-amber); color: #000; font-weight: bold; }

    /* タイムライン */
    .schedule-container {
      flex: 1;
      padding: 16px;
      overflow-y: auto;
      background: rgba(15, 23, 42, 0.4);
    }

    .timeline {
      position: relative;
      padding-left: 16px;
      border-left: 2px solid var(--glass-border);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .timeline-item {
      position: relative;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--glass-border);
      border-radius: 10px;
      padding: 12px 14px;
    }

    .timeline-item::before {
      content: '';
      position: absolute;
      left: -23px;
      top: 16px;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--accent-cyan);
      box-shadow: 0 0 8px var(--accent-cyan);
    }

    .timeline-item.return::before {
      background: var(--accent-amber);
      box-shadow: 0 0 8px var(--accent-amber);
    }

    .time-badge {
      font-size: 0.7rem;
      font-weight: bold;
      color: var(--accent-cyan);
      background: rgba(6, 182, 212, 0.15);
      padding: 2px 6px;
      border-radius: 4px;
      display: inline-block;
      margin-bottom: 4px;
    }

    .point-name { font-size: 0.88rem; font-weight: 600; margin-bottom: 4px; }
    .point-action { font-size: 0.8rem; color: var(--text-secondary); line-height: 1.4; }

    .loading-overlay {
      display: none;
      text-align: center;
      padding: 20px;
      color: var(--accent-cyan);
      font-size: 0.85rem;
      font-weight: bold;
    }

    /* 子育て相談ロボット（フローティングチャット） */
    .bot-fab {
      position: absolute;
      bottom: 20px;
      right: 20px;
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: var(--accent-gradient);
      box-shadow: 0 6px 20px rgba(6, 182, 212, 0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.6rem;
      cursor: pointer;
      z-index: 1000;
      transition: transform 0.2s;
    }
    .bot-fab:hover { transform: scale(1.08); }

    .chat-modal {
      display: none;
      position: absolute;
      bottom: 80px;
      right: 20px;
      width: calc(100% - 40px);
      max-width: 360px;
      height: 420px;
      background: #1e293b;
      border: 1px solid var(--glass-border);
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
      z-index: 1000;
      flex-direction: column;
      overflow: hidden;
      animation: popUp 0.25s ease-out;
    }

    @keyframes popUp {
      from { opacity: 0; transform: translateY(20px) scale(0.95); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .chat-header {
      padding: 10px 14px;
      background: rgba(255, 255, 255, 0.05);
      border-bottom: 1px solid var(--glass-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .chat-header h3 { font-size: 0.88rem; font-weight: 600; }
    .chat-close-btn { background: none; border: none; color: var(--text-secondary); cursor: pointer; font-size: 1rem; }

    #bot-chat-box {
      flex: 1;
      padding: 12px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
      font-size: 0.82rem;
    }

    .chat-msg {
      padding: 8px 12px;
      border-radius: 12px;
      line-height: 1.4;
      max-width: 85%;
      word-break: break-word;
    }
    .chat-msg.user { align-self: flex-end; background: var(--accent-blue); color: #fff; }
    .chat-msg.bot { align-self: flex-start; background: rgba(255, 255, 255, 0.08); border: 1px solid var(--glass-border); }

    .chat-input-area {
      padding: 8px 12px;
      border-top: 1px solid var(--glass-border);
      display: flex;
      gap: 6px;
      background: rgba(15, 23, 42, 0.9);
    }
    .chat-input-area input { flex: 1; padding: 6px 10px; border-radius: 6px; }
    .chat-input-area button { padding: 6px 12px; background: var(--accent-cyan); border: none; border-radius: 6px; color: #fff; font-weight: bold; cursor: pointer; }
  </style>
</head>
<body>

  <div class="app-container">
    <header>
      <div class="header-icon">🗺️</div>
      <h2>お散歩ルートプランナー</h2>
    </header>

    <div class="main-layout">
      <!-- 左パネル: 設定 ＆ タイムライン -->
      <div class="left-panel">
        <div class="walk-control-panel">
          <div class="setting-group">
            <div class="form-item full">
              <label>📍 場所:</label>
              <input type="text" id="loc-input" value="東京駅" placeholder="場所を入力 (例: 広島駅)" />
              <button class="btn-icon" onclick="confirmLocation()"><i class="fa-solid fa-magnifying-glass"></i> 移動</button>
              <button class="btn-icon" onclick="getCurrentLocation()"><i class="fa-solid fa-location-arrow"></i></button>
            </div>
          </div>

          <div class="setting-group">
            <div class="form-item">
              <label>年齢:</label>
              <select id="child-age">
                <option value="0歳(ベビーカー)">0歳(ベビーカー)</option>
                <option value="1〜2歳(よちよち)">1〜2歳(よちよち)</option>
                <option value="3〜4歳(元気)" selected>3〜4歳(元気)</option>
                <option value="5歳以上">5歳以上</option>
              </select>
            </div>

            <div class="form-item">
              <label>体型/体力:</label>
              <select id="child-build">
                <option value="標準" selected>標準</option>
                <option value="体力旺盛">体力旺盛</option>
                <option value="疲れやすい">疲れやすい</option>
              </select>
            </div>
          </div>

          <div class="setting-group">
            <div class="form-item">
              <label>様子:</label>
              <select id="child-state">
                <option value="ごきげん・元気" selected>ごきげん・元気</option>
                <option value="普通">普通</option>
                <option value="少し眠そう">少し眠そう</option>
                <option value="甘えたい">甘えたい</option>
              </select>
            </div>

            <div class="form-item">
              <label>親の疲労:</label>
              <select id="parent-fatigue">
                <option value="元気" selected>元気</option>
                <option value="少し疲れている">少し疲れている</option>
                <option value="かなり疲れた">かなり疲れた</option>
              </select>
            </div>
          </div>

          <div class="setting-group">
            <div class="form-item">
              <label>移動手段:</label>
              <select id="travel-method">
                <option value="指定なし">指定なし</option>
                <option value="徒歩" selected>徒歩</option>
                <option value="ベビーカー">ベビーカー</option>
                <option value="抱っこひも">抱っこひも</option>
              </select>
            </div>

            <div class="form-item">
              <label>目的・寄り道:</label>
              <select id="visit-type">
                <option value="指定なし">指定なし</option>
                <option value="公園(遊具あり)">公園(遊具あり)</option>
                <option value="室内・児童館">室内・児童館</option>
                <option value="カフェ休憩">カフェ休憩</option>
                <option value="自然・水辺">自然・水辺</option>
              </select>
            </div>
          </div>

          <div class="setting-group">
            <div class="form-item">
              <label>散歩時間:</label>
              <select id="walk-duration">
                <option value="30分程度">30分程度</option>
                <option value="1時間程度" selected>1時間程度</option>
                <option value="1.5時間程度">1.5時間程度</option>
              </select>
            </div>

            <div class="form-item">
              <label>設備優先:</label>
              <select id="facility-pref">
                <option value="指定なし">指定なし</option>
                <option value="多目的トイレ/授乳室優先">多目的トイレ・授乳室</option>
                <option value="日陰・屋根優先">日陰・屋根優先</option>
                <option value="段差・階段を避ける">段差・階段を避ける</option>
              </select>
            </div>
          </div>

          <button class="btn-submit" id="submit-btn" onclick="generateRoute()">ルートを提案</button>
        </div>

        <div class="status-bar">
          <span class="status-label">🚨 変化:</span>
          <div class="status-chip" onclick="updateEmergencyStatus('ぐずりだした（至急近くの休憩場所か最短帰宅ルート）')">😭 ぐずりだした</div>
          <div class="status-chip" onclick="updateEmergencyStatus('眠そう・寝た（段差のない最短帰宅ルート）')">😴 眠そう・寝た</div>
          <div class="status-chip" onclick="updateEmergencyStatus('疲れて歩かない（抱っこ・休憩重視）')">😫 疲れた</div>
        </div>

        <div class="schedule-container">
          <div id="loading" class="loading-overlay">道路に沿った最適なルートを計算中...</div>
          <div class="timeline" id="timeline-box">
            <p style="color: var(--text-secondary); text-align: center; font-size: 0.8rem; padding-top: 10px;">
              設定を確認し、「ルートを提案」ボタンを押してください。
            </p>
          </div>
        </div>
      </div>

      <!-- 右パネル: マップ表示 -->
      <div class="right-panel">
        <div id="map"></div>
      </div>
    </div>

    <!-- 子育て相談ロボット -->
    <div class="bot-fab" onclick="toggleChatModal()" title="子育て相談ロボ">🤖</div>

    <div class="chat-modal" id="chat-modal">
      <div class="chat-header">
        <h3>🤖 子育て相談ロボット</h3>
        <button class="chat-close-btn" onclick="toggleChatModal()"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div id="bot-chat-box">
        <div class="chat-msg bot">こんにちは！お散歩中のお悩みや、子育てに関する疑問など何でも聞かせてね。</div>
      </div>
      <div class="chat-input-area">
        <input type="text" id="bot-input" placeholder="例: ぐずり対策どうすればいい？" />
        <button onclick="sendBotMessage()">送信</button>
      </div>
    </div>
  </div>

  <script>
    let map = null;
    let markers = [];
    let routePolyline = null;
    let currentLat = 35.6812; // 初期値: 東京駅
    let currentLng = 139.7671;

    window.onload = () => {
      map = L.map('map').setView([currentLat, currentLng], 15);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© OpenStreetMap contributors'
      }).addTo(map);

      const initialMarker = L.marker([currentLat, currentLng]).addTo(map)
        .bindPopup('基準地点 (東京駅)').openPopup();
      markers.push(initialMarker);
    };

    async function geocodeLocation(query) {
      if (!query || query === "現在地") return { lat: currentLat, lng: currentLng };
      try {
        const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}`);
        const data = await res.json();
        if (data && data.length > 0) {
          return {
            lat: parseFloat(data[0].lat),
            lng: parseFloat(data[0].lon)
          };
        }
      } catch (e) {
        console.error("Geocoding Error", e);
      }
      return null;
    }

    async function confirmLocation() {
      const locationName = document.getElementById('loc-input').value.trim();
      if (!locationName) return;

      const coords = await geocodeLocation(locationName);
      if (coords) {
        currentLat = coords.lat;
        currentLng = coords.lng;
        clearMapLayers();
        map.setView([currentLat, currentLng], 15);
        const marker = L.marker([currentLat, currentLng]).addTo(map)
          .bindPopup(`<b>${locationName}</b>`).openPopup();
        markers.push(marker);
      } else {
        alert('指定された場所が見つかりませんでした。正確な地名を入力してください。');
      }
    }

    function getCurrentLocation() {
      const locInput = document.getElementById('loc-input');
      if (!navigator.geolocation) {
        alert('位置情報サービスに対応していません。');
        return;
      }
      locInput.value = "位置情報を取得中...";
      navigator.geolocation.getCurrentPosition(
        (pos) => {
          currentLat = pos.coords.latitude;
          currentLng = pos.coords.longitude;
          locInput.value = "現在地";
          confirmLocation();
        },
        () => {
          locInput.value = "";
          alert('位置情報の取得に失敗しました。');
        }
      );
    }

    function clearMapLayers() {
      markers.forEach(m => map.removeLayer(m));
      markers = [];
      if (routePolyline) {
        map.removeLayer(routePolyline);
        routePolyline = null;
      }
    }

    async function fetchRoadRoute(waypoints) {
      const coordsStr = waypoints.map(p => `${p[1]},${p[0]}`).join(';');
      const url = `https://router.project-osrm.org/route/v1/foot/${coordsStr}?overview=full&geometries=geojson`;

      try {
        const res = await fetch(url);
        if (!res.ok) return waypoints;
        const data = await res.json();
        if (data.code === 'Ok' && data.routes.length > 0) {
          return data.routes[0].geometry.coordinates.map(c => [c[1], c[0]]);
        }
      } catch (e) {
        console.error("OSRM Routing Error", e);
      }
      return waypoints;
    }

    async function generateRoute(emergencyStatus = null) {
      const locationName = document.getElementById('loc-input').value.trim() || '東京駅';
      const submitBtn = document.getElementById('submit-btn');
      const loading = document.getElementById('loading');
      const timelineBox = document.getElementById('timeline-box');

      submitBtn.disabled = true;
      loading.style.display = 'block';
      timelineBox.innerHTML = '';

      const coords = await geocodeLocation(locationName);
      if (coords) {
        currentLat = coords.lat;
        currentLng = coords.lng;
      }

      const walkContext = {
        location: locationName,
        childAge: document.getElementById('child-age').value,
        childBuild: document.getElementById('child-build').value,
        childState: emergencyStatus || document.getElementById('child-state').value,
        parentFatigue: document.getElementById('parent-fatigue').value,
        duration: document.getElementById('walk-duration').value,
        travelMethod: document.getElementById('travel-method').value,
        visitType: document.getElementById('visit-type').value,
        facilityPref: document.getElementById('facility-pref').value,
        isEmergency: !!emergencyStatus
      };

      try {
        const res = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ walkContext })
        });

        const data = await res.json();
        loading.style.display = 'none';

        if (data.plan) {
          await renderMapAndTimeline(coords || { lat: currentLat, lng: currentLng }, data.plan);
        } else {
          timelineBox.innerHTML = `<p style="color: red;">エラー: ${data.error || 'ルートの作成に失敗しました'}</p>`;
        }
      } catch (e) {
        loading.style.display = 'none';
        timelineBox.innerHTML = '<p style="color: red;">通信エラーが発生しました。</p>';
      } finally {
        submitBtn.disabled = false;
      }
    }

    function updateEmergencyStatus(status) {
      generateRoute(status);
    }

    async function renderMapAndTimeline(startCoords, plan) {
      clearMapLayers();
      const timelineBox = document.getElementById('timeline-box');
      timelineBox.innerHTML = '';

      const waypoints = [];
      waypoints.push([startCoords.lat, startCoords.lng]);

      plan.points.forEach((point, index) => {
        const isReturn = index === plan.points.length - 1;
        let pLat, pLng;

        if (isReturn) {
          pLat = startCoords.lat;
          pLng = startCoords.lng;
        } else {
          const angle = (index + 1) * (Math.PI / 2);
          const dist = 0.0025 + (index * 0.001);
          pLat = startCoords.lat + Math.sin(angle) * dist;
          pLng = startCoords.lng + Math.cos(angle) * dist;
        }

        waypoints.push([pLat, pLng]);

        const marker = L.marker([pLat, pLng]).addTo(map)
          .bindPopup(`<b>${point.time}</b><br>${point.name}`);
        markers.push(marker);

        const item = document.createElement('div');
        item.className = `timeline-item ${isReturn ? 'return' : ''}`;
        item.innerHTML = `
          <span class="time-badge">${point.time} (${point.duration})</span>
          <div class="point-name">${isReturn ? '🏁 ' : '📍 '}${point.name}</div>
          <div class="point-action">${point.action}</div>
        `;
        timelineBox.appendChild(item);
      });

      const roadPath = await fetchRoadRoute(waypoints);

      routePolyline = L.polyline(roadPath, {
        color: '#06b6d4',
        weight: 6,
        opacity: 0.85
      }).addTo(map);

      map.fitBounds(routePolyline.getBounds(), { padding: [30, 30] });
    }

    const botHistory = [];

    function toggleChatModal() {
      const modal = document.getElementById('chat-modal');
      modal.style.display = (modal.style.display === 'flex') ? 'none' : 'flex';
    }

    async function sendBotMessage() {
      const input = document.getElementById('bot-input');
      const box = document.getElementById('bot-chat-box');
      const text = input.value.trim();
      if (!text) return;

      const uMsg = document.createElement('div');
      uMsg.className = 'chat-msg user';
      uMsg.textContent = text;
      box.appendChild(uMsg);

      botHistory.push({ role: 'user', parts: [{ text }] });
      input.value = '';
      box.scrollTop = box.scrollHeight;

      try {
        const res = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: botHistory,
            botConsultMode: true
          })
        });

        const data = await res.json();
        const bMsg = document.createElement('div');
        bMsg.className = 'chat-msg bot';

        if (data.reply) {
          bMsg.textContent = data.reply;
          botHistory.push({ role: 'model', parts: [{ text: data.reply }] });
        } else {
          bMsg.textContent = "ごめんなさい、うまく答えられませんでした。";
        }
        box.appendChild(bMsg);
        box.scrollTop = box.scrollHeight;
      } catch (e) {
        const bMsg = document.createElement('div');
        bMsg.className = 'chat-msg bot';
        bMsg.textContent = "通信エラーが発生しました。";
        box.appendChild(bMsg);
      }
    }

    document.getElementById('bot-input').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') sendBotMessage();
    });
  </script>
</body>
</html>
