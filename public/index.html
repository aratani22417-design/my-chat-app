<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI & お散歩ナビゲーター</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🚶‍♂️</text></svg>">
  
  <!-- Markdownレンダリング用 -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  
  <!-- Map (Leaflet.js) -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f2744 100%);
      --glass-bg: rgba(255, 255, 255, 0.05);
      --glass-border: rgba(255, 255, 255, 0.12);
      --card-bg: #1e293b;
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      
      --accent-cyan: #06b6d4;
      --accent-blue: #3b82f6;
      --accent-green: #10b981;
      --accent-amber: #f59e0b;
      --accent-gradient: linear-gradient(135deg, #06b6d4 0%, #3b82f6 100%);
      
      --user-bubble: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
      --bot-bubble: rgba(255, 255, 255, 0.06);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg-gradient);
      color: var(--text-primary);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 12px;
    }

    .app-container {
      width: 100%;
      max-width: 950px;
      height: 92vh;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(16px);
      border-radius: 20px;
      border: 1px solid var(--glass-border);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* メインヘッダー＆タブ */
    header {
      padding: 12px 20px 0;
      border-bottom: 1px solid var(--glass-border);
      background: rgba(255, 255, 255, 0.02);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .header-title {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .header-icon {
      width: 34px;
      height: 34px;
      background: var(--accent-gradient);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
    }

    .tab-bar {
      display: flex;
      gap: 8px;
    }

    .tab-btn {
      padding: 10px 20px;
      background: transparent;
      border: none;
      border-bottom: 3px solid transparent;
      color: var(--text-secondary);
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .tab-btn.active {
      color: var(--accent-cyan);
      border-bottom-color: var(--accent-cyan);
    }

    /* コンテンツ表示枠 */
    .tab-content {
      flex: 1;
      display: none;
      flex-direction: column;
      overflow: hidden;
    }

    .tab-content.active {
      display: flex;
    }

    /* ------------------------------
       1. 通常チャットスタイル
    ------------------------------ */
    #chat-box {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .message {
      max-width: 82%;
      padding: 12px 16px;
      border-radius: 16px;
      line-height: 1.6;
      font-size: 0.92rem;
      word-break: break-word;
      animation: fadeIn 0.2s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .message.user {
      align-self: flex-end;
      background: var(--user-bubble);
      color: #fff;
      border-bottom-right-radius: 2px;
    }

    .message.bot {
      align-self: flex-start;
      background: var(--bot-bubble);
      border: 1px solid var(--glass-border);
      color: var(--text-primary);
      border-bottom-left-radius: 2px;
    }

    .message.bot p { margin-bottom: 0.5em; }
    .message.bot p:last-child { margin-bottom: 0; }
    .message.bot pre { background: #090d16; padding: 10px; border-radius: 6px; overflow-x: auto; margin: 8px 0; }
    .message.bot code { background: rgba(255,255,255,0.1); padding: 2px 4px; border-radius: 4px; }

    .input-container {
      padding: 14px 20px;
      background: rgba(15, 23, 42, 0.95);
      border-top: 1px solid var(--glass-border);
    }

    .input-area { display: flex; gap: 10px; }
    input[type="text"], select {
      padding: 10px 14px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--glass-border);
      border-radius: 10px;
      color: #fff;
      font-size: 0.9rem;
      outline: none;
    }
    input[type="text"]:focus { border-color: var(--accent-cyan); }
    select option { background: #1e293b; color: #fff; }

    .primary-btn {
      padding: 0 20px;
      background: var(--accent-gradient);
      color: white;
      border: none;
      border-radius: 10px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s;
    }
    .primary-btn:hover { opacity: 0.9; }
    .primary-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    /* ------------------------------
       2. お散歩機能スタイル
    ------------------------------ */
    .walk-layout {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* マップ表示エリア（デフォ表示） */
    #map {
      height: 280px;
      width: 100%;
      background: #090d16;
      border-bottom: 1px solid var(--glass-border);
    }

    .walk-control-panel {
      padding: 14px 20px;
      background: rgba(0, 0, 0, 0.2);
      border-bottom: 1px solid var(--glass-border);
      display: flex;
      flex-direction: column;
      gap: 10px;
      font-size: 0.85rem;
    }

    .setting-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
    }

    .mode-selector {
      display: flex;
      gap: 4px;
      background: rgba(255, 255, 255, 0.05);
      padding: 3px;
      border-radius: 8px;
    }

    .mode-btn {
      padding: 5px 12px;
      border-radius: 6px;
      border: none;
      background: transparent;
      color: var(--text-secondary);
      cursor: pointer;
      font-size: 0.82rem;
      font-weight: 600;
    }

    .mode-btn.active { background: var(--accent-cyan); color: #fff; }

    .geo-btn {
      padding: 6px 12px;
      background: rgba(16, 185, 129, 0.2);
      border: 1px solid var(--accent-green);
      color: var(--accent-green);
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.82rem;
    }

    /* リアルタイム状況変化 */
    .status-bar {
      padding: 8px 20px;
      background: rgba(245, 158, 11, 0.1);
      border-bottom: 1px solid rgba(245, 158, 11, 0.3);
      display: flex;
      align-items: center;
      gap: 8px;
      overflow-x: auto;
    }
    .status-label { font-size: 0.78rem; color: var(--accent-amber); white-space: nowrap; font-weight: bold; }
    .status-chip {
      padding: 4px 10px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--glass-border);
      border-radius: 12px;
      font-size: 0.75rem;
      cursor: pointer;
      white-space: nowrap;
    }
    .status-chip:hover { background: var(--accent-amber); color: #000; font-weight: bold; }

    #walk-result-box {
      flex: 1;
      padding: 16px 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* タイピング表示 */
    .typing-indicator { display: flex; gap: 4px; padding: 4px; }
    .dot { width: 6px; height: 6px; background: var(--accent-cyan); border-radius: 50%; animation: blink 1.2s infinite ease-in-out both; }
    .dot:nth-child(1) { animation-delay: -0.32s; }
    .dot:nth-child(2) { animation-delay: -0.16s; }
    @keyframes blink { 0%, 80%, 100% { opacity: 0.3; } 40% { opacity: 1; } }
  </style>
</head>
<body>

  <div class="app-container">
    <header>
      <div class="header-title">
        <div class="header-icon">⚡</div>
        <h2>AI アシスタント</h2>
      </div>
      <!-- 機能切り替えタブ -->
      <div class="tab-bar">
        <button class="tab-btn active" onclick="switchTab('chat')">💬 チャット</button>
        <button class="tab-btn" onclick="switchTab('walk')">🚶‍♂️ お散歩ルート提案</button>
      </div>
    </header>

    <!-- タブ1: 通常AIチャット -->
    <div id="tab-chat" class="tab-content active">
      <div id="chat-box"></div>
      <div class="input-container">
        <div class="input-area">
          <input type="text" id="chat-input" placeholder="メッセージを入力..." autocomplete="off" />
          <button class="primary-btn" id="chat-send-btn" onclick="sendChatMessage()">送信</button>
        </div>
      </div>
    </div>

    <!-- タブ2: お散歩提案（マップ連動） -->
    <div id="tab-walk" class="tab-content">
      <div class="walk-layout">
        <!-- デフォルト表示マップ -->
        <div id="map"></div>

        <!-- 設定パネル -->
        <div class="walk-control-panel">
          <div class="setting-row">
            <div class="mode-selector">
              <button class="mode-btn active" id="btn-child" onclick="switchWalkMode('child')">👶 子ども</button>
              <button class="mode-btn" id="btn-dog" onclick="switchWalkMode('dog')">🐕 愛犬</button>
            </div>
            
            <button class="geo-btn" onclick="getCurrentLocation()">📍 現在地を取得</button>
            <input type="text" id="loc-input" placeholder="場所を指定（例: 東京駅周辺）" style="flex: 1; min-width: 180px;" />

            <label>親の疲労:</label>
            <select id="parent-fatigue">
              <option value="元気">元気</option>
              <option value="少し疲れている">少し疲れている</option>
              <option value="かなり疲れた（ショートコース）">かなり疲れた</option>
            </select>
          </div>

          <!-- 子ども向けオプション -->
          <div class="setting-row" id="child-options">
            <label>年齢:</label>
            <select id="child-age">
              <option value="0歳(ベビーカー)">0歳(ベビーカー)</option>
              <option value="1〜2歳(よちよち歩き)">1〜2歳(よちよち)</option>
              <option value="3〜4歳(元気)">3〜4歳(元気)</option>
              <option value="5歳以上">5歳以上</option>
            </select>

            <label>体型/体力:</label>
            <select id="child-build">
              <option value="標準">標準</option>
              <option value="体力旺盛">体力旺盛</option>
              <option value="疲れやすい">疲れやすい</option>
            </select>

            <label>目的:</label>
            <select id="walk-purpose">
              <option value="近場の公園で体を動かす">公園で体を動かす</option>
              <option value="景色を見て帰るだけ">景色を見て散歩</option>
              <option value="カフェ・店舗に立ち寄り">カフェ・店舗立ち寄り</option>
            </select>

            <button class="primary-btn" id="walk-search-btn" onclick="requestWalkRoute()" style="margin-left: auto;">ルートを提案</button>
          </div>

          <!-- 愛犬向けオプション -->
          <div class="setting-row" id="dog-options" style="display: none;">
            <label>犬種サイズ:</label>
            <select id="dog-size">
              <option value="小型犬">小型犬</option>
              <option value="中型犬">中型犬</option>
              <option value="大型犬">大型犬</option>
            </select>

            <label>運動量:</label>
            <select id="dog-energy">
              <option value="ゆったりショート">ゆったりショート</option>
              <option value="標準">標準</option>
              <option value="たっぷりロング">たっぷりロング</option>
            </select>

            <button class="primary-btn" onclick="requestWalkRoute()" style="margin-left: auto;">ルートを提案</button>
          </div>
        </div>

        <!-- 状態チェンジャー -->
        <div class="status-bar">
          <span class="status-label">🚨 散歩中の変化:</span>
          <div class="status-chip" onclick="triggerStatusUpdate('子どもが元気に走り回り出しました！')">⚡ 元気いっぱい</div>
          <div class="status-chip" onclick="triggerStatusUpdate('子どもが少し疲れて歩くのが遅くなってきました。')">😮‍💨 疲れてきた</div>
          <div class="status-chip" onclick="triggerStatusUpdate('子どもがぐずり出しました！すぐ休めるルートを教えて！')">😭 ぐずりだした</div>
          <div class="status-chip" onclick="triggerStatusUpdate('子どもが寝てしまいました！ベビーカーで段差のない最短帰宅ルートを教えて。')">😴 寝た（最短帰宅）</div>
        </div>

        <!-- 結果ログエリア -->
        <div id="walk-result-box"></div>
      </div>
    </div>
  </div>

  <script>
    /* ==========================================
       共通 ＆ タブ切り替え制御
    ========================================== */
    let map = null;
    let currentMarker = null;
    let routeLine = null;
    let currentLat = 35.6812; // デフォルト: 東京駅付近
    let currentLng = 139.7671;

    function switchTab(tabName) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));

      if (tabName === 'chat') {
        document.querySelectorAll('.tab-btn')[0].classList.add('active');
        document.getElementById('tab-chat').classList.add('active');
      } else {
        document.querySelectorAll('.tab-btn')[1].classList.add('active');
        document.getElementById('tab-walk').classList.add('active');
        
        // タブ切り替え時にマップサイズを調整
        setTimeout(() => {
          if (!map) {
            initMap();
          } else {
            map.invalidateSize();
          }
        }, 100);
      }
    }

    /* ==========================================
       1. チャット機能
    ========================================== */
    const chatHistory = [];
    const chatBox = document.getElementById('chat-box');
    const chatInput = document.getElementById('chat-input');
    const chatSendBtn = document.getElementById('chat-send-btn');

    function appendChatMessage(sender, text, isMarkdown = false) {
      const div = document.createElement('div');
      div.className = `message ${sender}`;
      if (isMarkdown && typeof marked !== 'undefined') {
        div.innerHTML = marked.parse(text);
      } else {
        div.textContent = text;
      }
      chatBox.appendChild(div);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    async function sendChatMessage() {
      const text = chatInput.value.trim();
      if (!text) return;

      appendChatMessage('user', text);
      chatHistory.push({ role: 'user', parts: [{ text }] });
      chatInput.value = '';
      chatSendBtn.disabled = true;

      try {
        const res = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ contents: chatHistory })
        });
        const data = await res.json();
        if (data.reply) {
          appendChatMessage('bot', data.reply, true);
          chatHistory.push({ role: 'model', parts: [{ text: data.reply }] });
        } else {
          appendChatMessage('bot', `エラー: ${data.error || '失敗しました'}`);
        }
      } catch (e) {
        appendChatMessage('bot', '通信エラーが発生しました。');
      } finally {
        chatSendBtn.disabled = false;
      }
    }
    chatInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') sendChatMessage(); });

    /* ==========================================
       2. お散歩機能 ＆ マップ処理
    ========================================== */
    let walkMode = 'child';
    const walkHistory = [];
    const walkResultBox = document.getElementById('walk-result-box');

    // マップの初期化
    function initMap() {
      map = L.map('map').setView([currentLat, currentLng], 15);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© OpenStreetMap contributors'
      }).addTo(map);

      currentMarker = L.marker([currentLat, currentLng]).addTo(map)
        .bindPopup('現在地/指定地点').openPopup();
    }

    function switchWalkMode(mode) {
      walkMode = mode;
      document.getElementById('btn-child').classList.toggle('active', mode === 'child');
      document.getElementById('btn-dog').classList.toggle('active', mode === 'dog');
      document.getElementById('child-options').style.display = mode === 'child' ? 'flex' : 'none';
      document.getElementById('dog-options').style.display = mode === 'dog' ? 'flex' : 'none';
    }

    // 現在地の取得
    function getCurrentLocation() {
      const locInput = document.getElementById('loc-input');
      if (!navigator.geolocation) {
        alert('位置情報に対応していません。');
        return;
      }
      locInput.value = "位置情報を取得中...";
      navigator.geolocation.getCurrentPosition(
        (pos) => {
          currentLat = pos.coords.latitude;
          currentLng = pos.coords.longitude;
          locInput.value = `現在地 (緯度:${currentLat.toFixed(3)}, 経度:${currentLng.toFixed(3)})`;
          
          if (map) {
            map.setView([currentLat, currentLng], 15);
            currentMarker.setLatLng([currentLat, currentLng]).bindPopup('現在地').openPopup();
          }
        },
        () => {
          locInput.value = "";
          alert('位置情報の取得に失敗しました。手動で入力してください。');
        }
      );
    }

    function appendWalkMessage(sender, text, isMarkdown = false) {
      const div = document.createElement('div');
      div.className = `message ${sender}`;
      if (isMarkdown && typeof marked !== 'undefined') {
        div.innerHTML = marked.parse(text);
      } else {
        div.textContent = text;
      }
      walkResultBox.appendChild(div);
      walkResultBox.scrollTop = walkResultBox.scrollHeight;
    }

    // お散歩ルートのリクエスト
    async function requestWalkRoute(promptOverride = null) {
      const locationStr = document.getElementById('loc-input').value.trim() || '指定なし（周辺エリア）';
      const userText = promptOverride || `${locationStr} からスタートするおすすめのお散歩ルートを提案してください。`;

      appendWalkMessage('user', userText);
      walkHistory.push({ role: 'user', parts: [{ text: userText }] });

      const walkContext = {
        mode: walkMode,
        location: locationStr,
        parentFatigue: document.getElementById('parent-fatigue').value,
        childAge: document.getElementById('child-age').value,
        childBuild: document.getElementById('child-build').value,
        purpose: document.getElementById('walk-purpose').value,
        dogSize: document.getElementById('dog-size').value,
        dogEnergy: document.getElementById('dog-energy').value
      };

      try {
        const res = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ contents: walkHistory, walkContext })
        });
        const data = await res.json();
        if (data.reply) {
          appendWalkMessage('bot', data.reply, true);
          walkHistory.push({ role: 'model', parts: [{ text: data.reply }] });
          
          // マップ上に簡易的な周回イメージルートを描画
          drawDummyRoute();
        } else {
          appendWalkMessage('bot', `エラー: ${data.error || '取得失敗'}`);
        }
      } catch (e) {
        appendWalkMessage('bot', '通信エラーが発生しました。');
      }
    }

    // 状態チェンジャー発動
    function triggerStatusUpdate(statusText) {
      requestWalkRoute(`【状況変化】${statusText}`);
    }

    // マップに散歩ルートを描画（デモ用の現在地周回ルート線）
    function drawDummyRoute() {
      if (!map) return;
      if (routeLine) map.removeLayer(routeLine);

      // 現在地を中心に適当なルートポイントを生成（右→下→左→上）
      const offset = 0.003;
      const latlngs = [
        [currentLat, currentLng],
        [currentLat + offset, currentLng + offset],
        [currentLat + offset, currentLng - offset],
        [currentLat - offset, currentLng - offset],
        [currentLat, currentLng]
      ];

      routeLine = L.polyline(latlngs, { color: '#06b6d4', weight: 5, opacity: 0.8, dashArray: '8, 8' }).addTo(map);
      map.fitBounds(routeLine.getBounds(), { padding: [30, 30] });
    }

    // 初回初期化（チャットを表示）
    appendChatMessage('bot', 'こんにちは！通常のAIチャットへようこそ。どのようなことでもご相談ください。');
  </script>
</body>
</html>
