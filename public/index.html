<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>お散歩ルートプランナー</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🗺️</text></svg>">
  
  <!-- Map (Leaflet.js) -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f2744 100%);
      --glass-bg: rgba(255, 255, 255, 0.05);
      --glass-border: rgba(255, 255, 255, 0.12);
      --card-bg: #1e293b;
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      
      --accent-cyan: #06b6d4;
      --accent-blue: #3b82f6;
      --accent-green: #10b981;
      --accent-amber: #f59e0b;
      --accent-gradient: linear-gradient(135deg, #06b6d4 0%, #3b82f6 100%);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg-gradient);
      color: var(--text-primary);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 12px;
    }

    .app-container {
      width: 100%;
      max-width: 1000px;
      height: 94vh;
      background: rgba(15, 23, 42, 0.88);
      backdrop-filter: blur(16px);
      border-radius: 20px;
      border: 1px solid var(--glass-border);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    header {
      padding: 14px 20px;
      border-bottom: 1px solid var(--glass-border);
      background: rgba(255, 255, 255, 0.02);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .header-icon {
      width: 36px;
      height: 36px;
      background: var(--accent-gradient);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
    }

    /* フォーム領域 */
    .walk-control-panel {
      padding: 14px 20px;
      background: rgba(0, 0, 0, 0.25);
      border-bottom: 1px solid var(--glass-border);
      display: flex;
      flex-direction: column;
      gap: 12px;
      font-size: 0.85rem;
    }

    .setting-row {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
    }

    .form-group {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    input[type="text"], select {
      padding: 8px 12px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--glass-border);
      border-radius: 8px;
      color: #fff;
      font-size: 0.85rem;
      outline: none;
    }
    input[type="text"]:focus, select:focus { border-color: var(--accent-cyan); }
    select option { background: #1e293b; color: #fff; }

    .btn-geo {
      padding: 8px 12px;
      background: rgba(16, 185, 129, 0.2);
      border: 1px solid var(--accent-green);
      color: var(--accent-green);
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.82rem;
      font-weight: 600;
    }

    .btn-submit {
      padding: 8px 24px;
      background: var(--accent-gradient);
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      margin-left: auto;
      transition: all 0.2s;
    }
    .btn-submit:hover { opacity: 0.9; transform: translateY(-1px); }
    .btn-submit:disabled { opacity: 0.5; cursor: not-allowed; }

    /* メインコンテンツ（マップ＋スケジュール） */
    .content-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* 地図 */
    #map {
      height: 45%;
      width: 100%;
      background: #090d16;
      border-bottom: 1px solid var(--glass-border);
    }

    /* リアルタイム状況変化（緊急帰宅ボタン） */
    .status-bar {
      padding: 10px 20px;
      background: rgba(245, 158, 11, 0.12);
      border-bottom: 1px solid rgba(245, 158, 11, 0.3);
      display: flex;
      align-items: center;
      gap: 10px;
      overflow-x: auto;
    }
    .status-label { font-size: 0.8rem; color: var(--accent-amber); white-space: nowrap; font-weight: bold; }
    .status-chip {
      padding: 5px 12px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--glass-border);
      border-radius: 12px;
      font-size: 0.78rem;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s;
    }
    .status-chip:hover { background: var(--accent-amber); color: #000; font-weight: bold; }

    /* タイムライン（スケジュール一覧） */
    .schedule-container {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
      background: rgba(15, 23, 42, 0.5);
    }

    .schedule-title {
      font-size: 1rem;
      font-weight: 600;
      margin-bottom: 16px;
      color: var(--accent-cyan);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .timeline {
      position: relative;
      padding-left: 20px;
      border-left: 2px solid var(--glass-border);
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .timeline-item {
      position: relative;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--glass-border);
      border-radius: 12px;
      padding: 14px 18px;
    }

    .timeline-item::before {
      content: '';
      position: absolute;
      left: -27px;
      top: 18px;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--accent-cyan);
      box-shadow: 0 0 10px var(--accent-cyan);
    }

    .timeline-item.return::before {
      background: var(--accent-amber);
      box-shadow: 0 0 10px var(--accent-amber);
    }

    .time-badge {
      font-size: 0.75rem;
      font-weight: bold;
      color: var(--accent-cyan);
      background: rgba(6, 182, 212, 0.15);
      padding: 2px 8px;
      border-radius: 4px;
      display: inline-block;
      margin-bottom: 6px;
    }

    .point-name {
      font-size: 1rem;
      font-weight: 600;
      margin-bottom: 6px;
    }

    .point-action {
      font-size: 0.88rem;
      color: var(--text-secondary);
      line-height: 1.5;
    }

    .loading-overlay {
      display: none;
      text-align: center;
      padding: 40px;
      color: var(--accent-cyan);
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div class="app-container">
    <header>
      <div class="header-icon">🗺️</div>
      <h2>お散歩ルートプランナー</h2>
    </header>

    <!-- フォーム設定エリア -->
    <div class="walk-control-panel">
      <div class="setting-row">
        <div class="form-group">
          <label>📍 出発地/目的の場所:</label>
          <input type="text" id="loc-input" placeholder="例: 東京駅、代々木公園" style="width: 220px;" />
          <button class="btn-geo" onclick="getCurrentLocation()">現在地</button>
        </div>

        <div class="form-group">
          <label>👶 子供の年齢:</label>
          <select id="child-age">
            <option value="0歳(ベビーカー)">0歳(ベビーカー)</option>
            <option value="1〜2歳(よちよち)">1〜2歳(よちよち)</option>
            <option value="3〜4歳(元気)">3〜4歳(元気)</option>
            <option value="5歳以上">5歳以上</option>
          </select>
        </div>

        <div class="form-group">
          <label>体型/体力:</label>
          <select id="child-build">
            <option value="標準">標準</option>
            <option value="体力旺盛">体力旺盛</option>
            <option value="疲れやすい">疲れやすい</option>
          </select>
        </div>
      </div>

      <div class="setting-row">
        <div class="form-group">
          <label>😃 子供の様子:</label>
          <select id="child-state">
            <option value="ごきげん・元気">ごきげん・元気</option>
            <option value="普通">普通</option>
            <option value="少し眠そう">少し眠そう</option>
            <option value="甘えたいモード">甘えたいモード</option>
          </select>
        </div>

        <div class="form-group">
          <label>😮‍💨 親の疲労度:</label>
          <select id="parent-fatigue">
            <option value="元気">元気</option>
            <option value="少し疲れている">少し疲れている</option>
            <option value="かなり疲れた">かなり疲れた</option>
          </select>
        </div>

        <div class="form-group">
          <label>⏱️ 散歩時間:</label>
          <select id="walk-duration">
            <option value="30分程度">30分程度</option>
            <option value="1時間程度" selected>1時間程度</option>
            <option value="1.5時間程度">1.5時間程度</option>
            <option value="2時間以上">2時間以上</option>
          </select>
        </div>

        <button class="btn-submit" id="submit-btn" onclick="generateRoute()">ルートを提案</button>
      </div>
    </div>

    <!-- メインコンテンツ -->
    <div class="content-area">
      <!-- マップ -->
      <div id="map"></div>

      <!-- 緊急時の状態チェンジャー -->
      <div class="status-bar">
        <span class="status-label">🚨 途中で状態が変わったら:</span>
        <div class="status-chip" onclick="updateEmergencyStatus('ぐずりだした（至急近くの休憩場所か最短帰宅ルート）')">😭 ぐずりだした</div>
        <div class="status-chip" onclick="updateEmergencyStatus('眠そう・寝た（段差のない最短帰宅ルート）')">😴 眠そう・寝た</div>
        <div class="status-chip" onclick="updateEmergencyStatus('疲れて歩かなくなった（抱っこ・休憩重視）')">😫 疲れた</div>
      </div>

      <!-- スケジュール（タイムライン）表示 -->
      <div class="schedule-container">
        <div class="schedule-title" id="schedule-header">
          <span>お散歩スケジュール</span>
        </div>

        <div id="loading" class="loading-overlay">最適なルートとスケジュールを計算中...</div>
        <div class="timeline" id="timeline-box">
          <p style="color: var(--text-secondary); text-align: center;">条件を入力して「ルートを提案」ボタンを押してください。</p>
        </div>
      </div>
    </div>
  </div>

  <script>
    let map = null;
    let markers = [];
    let routePolyline = null;
    let currentLat = 35.6812; // 初期値: 東京駅
    let currentLng = 139.7671;

    // 地図の初期化
    window.onload = () => {
      map = L.map('map').setView([currentLat, currentLng], 15);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© OpenStreetMap contributors'
      }).addTo(map);

      // 初期の東京駅ピン
      const initialMarker = L.marker([currentLat, currentLng]).addTo(map)
        .bindPopup('基準地点').openPopup();
      markers.push(initialMarker);
    };

    // 現在地取得
    function getCurrentLocation() {
      const locInput = document.getElementById('loc-input');
      if (!navigator.geolocation) {
        alert('位置情報サービスに対応していません。');
        return;
      }
      locInput.value = "現在地を取得中...";
      navigator.geolocation.getCurrentPosition(
        (pos) => {
          currentLat = pos.coords.latitude;
          currentLng = pos.coords.longitude;
          locInput.value = "現在地";
          updateMapCenter(currentLat, currentLng, "現在地");
        },
        () => {
          locInput.value = "";
          alert('位置情報の取得に失敗しました。場所名を直接入力してください。');
        }
      );
    }

    // 地名のジオコーディング（Nominatim APIを利用）
    async function geocodeLocation(query) {
      if (!query || query === "現在地") return { lat: currentLat, lng: currentLng };
      try {
        const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}`);
        const data = await res.json();
        if (data && data.length > 0) {
          return { lat: parseFloat(data[0].lat), lng: parseFloat(data[0].lon) };
        }
      } catch (e) {
        console.error("Geocoding Error", e);
      }
      return { lat: currentLat, lng: currentLng };
    }

    function updateMapCenter(lat, lng, popupText) {
      clearMapLayers();
      currentLat = lat;
      currentLng = lng;
      map.setView([lat, lng], 15);
      const marker = L.marker([lat, lng]).addTo(map).bindPopup(popupText).openPopup();
      markers.push(marker);
    }

    function clearMapLayers() {
      markers.forEach(m => map.removeLayer(m));
      markers = [];
      if (routePolyline) {
        map.removeLayer(routePolyline);
        routePolyline = null;
      }
    }

    // ルート＆スケジュール提案リクエスト
    async function generateRoute(emergencyStatus = null) {
      const locationName = document.getElementById('loc-input').value.trim() || '東京駅';
      const submitBtn = document.getElementById('submit-btn');
      const loading = document.getElementById('loading');
      const timelineBox = document.getElementById('timeline-box');

      submitBtn.disabled = true;
      loading.style.display = 'block';
      timelineBox.innerHTML = '';

      // 1. 位置情報の確定（地名から経緯度を取得）
      const coords = await geocodeLocation(locationName);
      currentLat = coords.lat;
      currentLng = coords.lng;

      // 2. リクエストデータの構築
      const walkContext = {
        location: locationName,
        childAge: document.getElementById('child-age').value,
        childBuild: document.getElementById('child-build').value,
        childState: emergencyStatus || document.getElementById('child-state').value,
        parentFatigue: document.getElementById('parent-fatigue').value,
        duration: document.getElementById('walk-duration').value,
        isEmergency: !!emergencyStatus
      };

      try {
        const res = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ walkContext })
        });

        const data = await res.json();
        loading.style.display = 'none';

        if (data.plan) {
          renderMapAndTimeline(coords, data.plan);
        } else {
          timelineBox.innerHTML = `<p style="color: red;">エラー: ${data.error || 'ルートの作成に失敗しました'}</p>`;
        }
      } catch (e) {
        loading.style.display = 'none';
        timelineBox.innerHTML = '<p style="color: red;">通信エラーが発生しました。</p>';
      } finally {
        submitBtn.disabled = false;
      }
    }

    // 途中の状況変化（ぐずり・眠そうなど）で緊急ルート作成
    function updateEmergencyStatus(status) {
      generateRoute(status);
    }

    // マップへの描画とスケジュール出力
    function renderMapAndTimeline(startCoords, plan) {
      clearMapLayers();

      const timelineBox = document.getElementById('timeline-box');
      timelineBox.innerHTML = '';

      const latlngs = [];
      
      // スタート位置を追加
      latlngs.push([startCoords.lat, startCoords.lng]);

      // スケジュールポイントごとに処理
      plan.points.forEach((point, index) => {
        // 現在地から周辺の座標を適宜オフセット（可視化用）
        const latOffset = (index + 1) * 0.002 * (index % 2 === 0 ? 1 : -0.8);
        const lngOffset = (index + 1) * 0.002 * (index % 2 === 0 ? -0.8 : 1);
        
        // 最終ポイント（帰宅地点）はスタート位置に戻す
        const pLat = index === plan.points.length - 1 ? startCoords.lat : startCoords.lat + latOffset;
        const pLng = index === plan.points.length - 1 ? startCoords.lng : startCoords.lng + lngOffset;

        latlngs.push([pLat, pLng]);

        // ピンを立てる
        const isReturn = index === plan.points.length - 1;
        const marker = L.marker([pLat, pLng]).addTo(map)
          .bindPopup(`<b>${point.time}</b><br>${point.name}`);
        markers.push(marker);

        // タイムライン描画
        const item = document.createElement('div');
        item.className = `timeline-item ${isReturn ? 'return' : ''}`;
        item.innerHTML = `
          <span class="time-badge">${point.time} (${point.duration})</span>
          <div class="point-name">${isReturn ? '🏁 ' : '📍 '}${point.name}</div>
          <div class="point-action">${point.action}</div>
        `;
        timelineBox.appendChild(item);
      });

      // ルート線を引き、マップの表示領域を自動調整
      routePolyline = L.polyline(latlngs, {
        color: '#06b6d4',
        weight: 5,
        opacity: 0.8,
        dashArray: '6, 8'
      }).addTo(map);

      map.fitBounds(routePolyline.getBounds(), { padding: [40, 40] });
    }
  </script>
</body>
</html>
